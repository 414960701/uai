apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uai-forge
  namespace: uai-forge
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: forge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uai-forge-frontend
                port:
                  name: http
    - host: api.forge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uai-forge-backend
                port:
                  name: http
