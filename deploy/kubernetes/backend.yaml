apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uai-forge-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uai-forge-backend
  labels:
    app.kubernetes.io/name: uai-forge
    app.kubernetes.io/component: backend
spec:
  # 0.1.x uses SQLite and in-process Run tasks. Do not increase this replica
  # count; scale-out requires the planned durable database/bus/lease adapters.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uai-forge
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uai-forge
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: ghcr.io/your-org/uai-forge-backend:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: uai-forge-config
          env:
            - name: UAI_FORGE_CONTROL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: uai-forge-control
                  key: control-api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - uai-forge
                - doctor
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uai-forge-data
---
apiVersion: v1
kind: Service
metadata:
  name: uai-forge-backend
  labels:
    app.kubernetes.io/name: uai-forge
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: uai-forge
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
