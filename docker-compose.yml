name: uai-forge

services:
  backend:
    image: ${UAI_FORGE_BACKEND_IMAGE:-uai-forge-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    environment:
      UAI_FORGE_ALLOWED_ORIGINS: ${UAI_FORGE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      UAI_FORGE_CONTROL_API_KEY: ${UAI_FORGE_CONTROL_API_KEY:-}
      UAI_FORGE_CREDENTIAL_MASTER_KEY: ${UAI_FORGE_CREDENTIAL_MASTER_KEY:-}
      UAI_FORGE_DATABASE_PATH: /data/forge.db
      UAI_FORGE_HOST: 0.0.0.0
      UAI_FORGE_PORT: "8000"
    init: true
    ports:
      - "${UAI_FORGE_BIND_ADDRESS:-127.0.0.1}:${UAI_FORGE_API_PORT:-8000}:8000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - uai-forge-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    image: ${UAI_FORGE_FRONTEND_IMAGE:-uai-forge-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
    init: true
    ports:
      - "${UAI_FORGE_BIND_ADDRESS:-127.0.0.1}:${UAI_FORGE_WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  uai-forge-data:
    name: ${UAI_FORGE_DATA_VOLUME:-uai-forge-data}
