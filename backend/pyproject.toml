[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uai-forge"
version = "0.1.0"
description = "An extensible Python agent runtime and multi-agent control plane."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "UAI Forge Contributors" }]
dependencies = [
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
]

[project.scripts]
uai-forge = "uai_forge.cli:main"

[project.entry-points."uai_forge.plugins"]
# Third-party packages expose a zero-argument object with register(registry).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
